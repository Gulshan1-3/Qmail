[workspace]
resolver = "2"
members = [
    "crates/qumail-core",
    "crates/qumail-kme",
    "crates/qumail-crypto",
    "crates/qumail-net",
    "crates/qumail-cli",
    "crates/qumail-ui",
]
exclude = [
    "qkd_kme_server",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["QuMail Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gulshan1-3/Qmail"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
